  <body>
    <div id="root"><div style="min-height:100vh;background:#f4f7f9;direction:rtl"><div style="background:#0b3c73;height:128px;display:flex;align-items:center;justify-content:center;color:#fff;font:800 22px system-ui,sans-serif">صيدلية الخليل</div></div></div>
    <div id="kh-welcome" role="dialog" aria-label="مرحبا بك في صيدلية الخليل" style="display:none">
      <style>
        #kh-welcome{position:fixed;inset:0;z-index:99999;direction:rtl;font-family:Tajawal,system-ui,sans-serif;color:#fff;background:radial-gradient(120% 70% at 50% 0%,#1c78dc 0%,#0b3c73 55%,#082c57 100%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(28px,env(safe-area-inset-top)) 26px max(28px,env(safe-area-inset-bottom));text-align:center;transition:opacity .35s ease,transform .35s ease;overflow:hidden}
        #kh-welcome.kh-w-out{opacity:0;transform:scale(1.03);pointer-events:none}
        #kh-welcome .kh-w-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;max-width:420px;width:100%}
        #kh-welcome .kh-w-logo{width:150px;height:150px;border-radius:30px;background:#fff;padding:8px;object-fit:contain;box-shadow:0 14px 40px rgba(0,0,0,.3);animation:khw-pop .7s cubic-bezier(.2,.9,.3,1.2) both}
        #kh-welcome h1{margin:10px 0 0;font-size:34px;font-weight:800;line-height:1.2}
        #kh-welcome h1 b{color:#4fb3f0}
        #kh-welcome p{margin:0;font-size:17px;line-height:1.7;color:rgba(255,255,255,.88);animation:khw-up .6s .15s ease both}
        #kh-welcome .kh-w-perks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;animation:khw-up .6s .3s ease both}
        #kh-welcome .kh-w-perks span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500}
        #kh-welcome .kh-w-bot{width:100%;max-width:420px;animation:khw-up .6s .45s ease both}
        #kh-welcome button{width:100%;border:0;border-radius:18px;background:linear-gradient(180deg,#f2d36b,#4fb3f0);color:#0b3c73;font:800 20px Tajawal,system-ui,sans-serif;padding:17px 20px;box-shadow:0 10px 26px rgba(0,0,0,.28);cursor:pointer}
        #kh-welcome button:active{transform:scale(.98)}
        #kh-welcome small{display:block;margin-top:12px;font-size:13px;color:rgba(255,255,255,.7)}
        @keyframes khw-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
        @keyframes khw-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
        @media (prefers-reduced-motion:reduce){#kh-welcome *{animation:none!important}}
              #kh-welcome .kh-w-bar{width:150px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:18px}
        #kh-welcome .kh-w-bar i{display:block;height:100%;width:100%;background:#4fb3f0;border-radius:4px;transform-origin:right;animation:khw-bar 2.1s cubic-bezier(.4,0,.2,1) both}
        @keyframes khw-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      </style>
      <div></div>
      <div class="kh-w-mid">
        <img class="kh-w-logo" src="./icons/welcome-logo.webp" alt="" width="150" height="150" />
        <h1>صيدلية <b>الخليل</b></h1>
        <p>أهلاً بيك. اطلب دواءك ومستلزماتك والتوصيل لحد باب البيت.</p>
        <div class="kh-w-bar"><i></i></div>
        <div class="kh-w-perks"><span>توصيل مجاني 24 ساعة</span><span>أكتر من 37 ألف صنف</span><span>نقاط ولاء على كل طلب</span></div>
      </div>
    </div>
    <script>
      (function(){try{
        var w=document.getElementById('kh-welcome');
        if(sessionStorage.getItem('kh_w')||/^#\/admin/.test(location.hash)){w.remove();return}
        w.style.display='flex';document.documentElement.style.overflow='hidden';
        var done=function(){if(!w.parentNode)return;sessionStorage.setItem('kh_w','1');w.classList.add('kh-w-out');document.documentElement.style.overflow='';
          setTimeout(function(){w.remove()},380)};
        setTimeout(done,2300);w.onclick=done;
      }catch(e){var x=document.getElementById('kh-welcome');x&&x.remove()}})();
    </script>
  </body>
